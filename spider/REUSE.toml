# Machine-readable licensing for everything under spider/, in the REUSE 3.3 format
# (https://reuse.software/spec-3.3/). Paths are relative to this file.
#
# It exists because the interesting files here -- a JSON Lines rows file and eighteen
# SQLite databases -- cannot carry a comment, and a scanner that finds no marking assumes
# the repository's headline licence. That assumption is wrong for this directory: the data
# is CC BY-SA 4.0 and the code around it is Apache-2.0. NOTICE states the same boundary in
# prose, by content rather than by path.

version = 1

[[annotations]]
path = "spider_300.jsonl"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 Tao Yu, Rui Zhang, Kai Yang, Michihiro Yasunaga, Dongxu Wang, Zifan Li, James Ma, Irene Li, Qingning Yao, Shanelle Roman, Yi Zhang, Dragomir Radev (Spider 1.0)"
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileComment = "A modified subset of the Spider 1.0 development split. Questions, gold SQL and schema strings are verbatim; selection, shaping and the added metadata are the adaptation. See LICENSE-DATA."

[[annotations]]
path = "databases/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 Tao Yu, Rui Zhang, Kai Yang, Michihiro Yasunaga, Dongxu Wang, Zifan Li, James Ma, Irene Li, Qingning Yao, Shanelle Roman, Yi Zhang, Dragomir Radev (Spider 1.0)"
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileComment = "SQLite databases as distributed with Spider 1.0, limited to the ones the shipped rows need."

[[annotations]]
path = "LICENSE-DATA"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 Spider 1.0 contributors; 2026 Traigent Ltd"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "datasheet.yaml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Traigent Ltd"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "provenance.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Traigent Ltd"
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileComment = "Written by build_slice.py. Records the sha256 of the source pool and of the rows file, and is what a later run of that script is allowed to overwrite."

[[annotations]]
path = "REUSE.toml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Traigent Ltd"
SPDX-License-Identifier = "Apache-2.0"

# Apache-2.0 as a work, and it quotes two Spider questions in its docstring to explain what
# the near-duplicate and gold-grouping filters are for. Both statements are about different
# bytes of the same file and both are true.
[[annotations]]
path = "build_slice.py"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Traigent Ltd; 2018 Spider 1.0 contributors for the quoted questions"
SPDX-License-Identifier = "Apache-2.0 AND CC-BY-SA-4.0"
