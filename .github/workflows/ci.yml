name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The interpreter is the one the steps below assume
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"

      - name: Install the checkers
        run: python -m pip install -r requirements-dev.txt

      - name: Validate the components and the committed data
        run: python build.py check

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Format
        run: black --check build.py spider tests components

      - name: Lint
        run: ruff check build.py spider tests components

      - name: Types
        run: mypy --strict build.py spider/build_slice.py
