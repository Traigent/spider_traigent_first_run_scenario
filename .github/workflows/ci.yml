name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two interpreters, and the order decides which one is `python`.
      # 3.10 goes first only so that the --existing-venv old-python build has an
      # interpreter to find on PATH; without it that test skips. 3.12 goes second, so
      # 3.12 is the `python` every step below runs on. The last setup-python wins.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the checkers
        run: python -m pip install -r requirements-dev.txt

      - name: Validate the components and the committed data
        run: python build.py check

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Format
        run: black --check build.py spider tests components

      - name: Lint
        run: ruff check build.py spider tests components

      - name: Types
        run: mypy --strict build.py spider/build_slice.py
