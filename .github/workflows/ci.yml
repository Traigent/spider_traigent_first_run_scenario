name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    # The suite itself runs in 1-3 minutes; the rest is installs, and the litellm
    # tree the Tests step pulls is ~100 MB on a cold cache. 20 minutes leaves room
    # for a slow mirror while still killing a hung job in minutes rather than in
    # the six hours GitHub allows by default.
    timeout-minutes: 20

    # build.py's SUPPORTED_PYTHONS claims python3.13, python3.12 and python3.11,
    # and the suite asserts 11 <= minor <= 13. A single 3.13 job proved one third
    # of that claim, so CI now runs every version the repository says it supports.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # The Tests step has build.py --venv ready pip-install litellm==1.93.0 into
          # a throwaway project venv: ~100 MB of wheels fetched from PyPI on every
          # run. That venv is not cached, but pip's HTTP cache under ~/.cache/pip is,
          # so a PyPI blip stops deciding whether this repository's code is green.
          # The pin lives in build.py (AGENT_REQUIREMENT), not in a requirements
          # file, so build.py is part of the cache key: changing the pin busts the
          # cache instead of quietly serving the wheels for the old one.
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            build.py

      - name: The interpreter is the one the steps below assume
        run: |
          python -c "import sys; want='${{ matrix.python-version }}'; got='.'.join(map(str, sys.version_info[:2])); assert got == want, (got, want, sys.version)"

      - name: Install the checkers
        run: python -m pip install -r requirements-dev.txt

      # The static checks run before the tests: they take seconds, they read the
      # same files, and a formatting, lint or typing error used to sit invisible
      # behind a test failure.
      # docs/measurements/score_bank.py is in these three targets deliberately. It is
      # not a document: it is the program that produces every published readiness figure,
      # it has twice destroyed the committed evidence under docs/measurements/cards/, and
      # while it sat outside every target here those repairs could be reverted with CI
      # still green. tests/test_score_bank.py holds its behaviour; these hold its shape.
      - name: Format
        run: black --check build.py spider tests components docs/measurements/score_bank.py

      - name: Lint
        run: ruff check build.py spider tests components docs/measurements/score_bank.py

      - name: Types
        run: |
          mypy --strict build.py spider/build_slice.py docs/measurements/score_bank.py
          # components/ ships to customers as files they open and edit, deliberately
          # untyped. --strict there reports 138 errors that could only be answered by
          # annotating the very files a customer is meant to read, so components gets
          # the widest stance that passes today instead: the bodies of untyped
          # functions are checked (--check-untyped-defs), the litellm import is
          # tolerated (litellm is installed into the generated project's venv, never
          # into this job), and var-annotated is off because its only six hits are
          # "annotate this empty list" inside those same untyped functions.
          # --explicit-package-bases is required because agent/direct/ and
          # agent/openrouter/ ship same-named modules on purpose (agent_ready.py,
          # agent_no_knobs.py) and mypy otherwise refuses the duplicate module name.
          mypy --check-untyped-defs --ignore-missing-imports --explicit-package-bases --disable-error-code=var-annotated components
          # tests/ is deliberately NOT type-checked here. mypy reports errors in the
          # hundreds on the suite as it stands -- with default settings, not only
          # under --strict -- and nearly all of them are attributes assigned in
          # setUpClass, which mypy cannot see without class-level annotations.
          # Covering tests/ means rewriting the suite, which is a change to tests/
          # and not to CI, so the gap is written down here rather than silently left
          # out. Revisit when tests/ settles: it was mid-rewrite when this was added.

      # Cheap data/component validation, and it is what the tests build on, so it
      # runs after the static checks and before the slow test step: a broken
      # component or a bad data file then fails in seconds.
      - name: Validate the components and the committed data
        run: python build.py check

      - name: Tests
        run: python -m unittest discover -s tests -v

  # The committed measurement under docs/measurements/cards/ is evidence, and until this job
  # nothing re-took it: a card could be hand-edited, or left behind by a builder change that
  # moved what a preset ships, with every other check green. This re-runs the whole sweep
  # against the guide at the revision the cards were taken at, publishes nothing, and fails
  # unless every card that scored comes back byte-identical and every refusal the record holds
  # is refused again in the same words (`score_bank.py --compare`, which also refuses to
  # compare nothing).
  #
  # Nothing about that environment is written here. The guide revision is the pin in
  # score_bank.py, and the Python and SDK versions are the ones preflight printed into the
  # committed cards: `--recorded-environment` reads them, and `--compare` checks this job
  # really is that environment before it builds anything, because a card records the
  # interpreter it was taken on and would otherwise differ for that reason alone.
  measurements:
    runs-on: ubuntu-24.04
    # About four minutes of sweep and one install; 30 leaves room for a slow mirror.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      # No pipe: a pipe's status is its last command's, so `score_bank.py` failing into
      # `tee` would pass this step with nothing recorded. Every value is required, so an
      # empty one stops here rather than as a confusing install of "traigent==".
      - name: Read the environment the committed cards were measured in
        id: recorded
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/measurements/score_bank.py --recorded-environment > "$RUNNER_TEMP/recorded.env"
          cat "$RUNNER_TEMP/recorded.env"
          for name in guide python traigent litellm; do
            grep -Eq "^${name}=[^[:space:]]+$" "$RUNNER_TEMP/recorded.env" \
              || { echo "::error::the recorded environment has no ${name}"; exit 1; }
          done
          cat "$RUNNER_TEMP/recorded.env" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.recorded.outputs.python }}

      - name: Install the SDK and litellm at the versions the cards were measured with
        run: python -m pip install "litellm==${{ steps.recorded.outputs.litellm }}" "traigent==${{ steps.recorded.outputs.traigent }}"

      - name: Check out the guide at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: Traigent/traigent-first-run
          ref: ${{ steps.recorded.outputs.guide }}
          path: guide
          persist-credentials: false

      - name: Re-measure every run and compare it with the committed cards
        working-directory: repo
        run: python docs/measurements/score_bank.py --guide ../guide --workspace "$RUNNER_TEMP/readiness-bank" --compare
