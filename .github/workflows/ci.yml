name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3.10 is needed by the --existing-venv old-python build; without it that test skips.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the checkers
        run: python -m pip install --require-hashes=false -r requirements-dev.txt

      - name: Validate the components and the committed data
        run: python build.py check

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Format
        run: black --check build.py spider tests

      - name: Lint
        run: ruff check build.py spider tests

      - name: Types
        run: mypy --strict build.py spider/build_slice.py
